name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The full CI (lint, deadcode, unit, conformance, macOS, e2e) must pass
  # before anything is published.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release binaries
        run: make release VERSION=${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/dcx-linux-amd64
            bin/dcx-linux-arm64
            bin/dcx-darwin-amd64
            bin/dcx-darwin-arm64
            bin/checksums.txt
          generate_release_notes: true
