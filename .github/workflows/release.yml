name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The full CI (lint, deadcode, unit, conformance, macOS, e2e) must pass
  # before anything is published.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The release notes are the tag's section of CHANGELOG.md
      # ("## 0.8.0 (date)" for v0.8.0); a tag without one fails here,
      # before anything is published.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if ($0 == "## " v || index($0, "## " v " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi

      - name: Build release binaries
        run: make release VERSION=${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/dcx-linux-amd64
            bin/dcx-linux-arm64
            bin/dcx-darwin-amd64
            bin/dcx-darwin-arm64
            bin/checksums.txt
          body_path: release-notes.md
