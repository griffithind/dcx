version: "2"

run:
  # Lint the e2e tests too (they are behind the e2e build tag).
  build-tags:
    - e2e

formatters:
  # gofmt, and imports grouped standard library first (`make fmt` fixes
  # both).
  enable:
    - gofmt
    - goimports

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused)
  # plus depguard, which enforces the package rules in CLAUDE.md, and
  # noctx/bodyclose for the HTTP code (feature registries).
  enable:
    - depguard
    - noctx
    - bodyclose
  exclusions:
    rules:
      # noctx is here for HTTP requests; local sockets and processes are
      # short-lived or bounded by their callers.
      - linters: [noctx]
        text: "^(net|os/exec)\\."
  settings:
    errcheck:
      exclude-functions:
        # e2e tests run dcx for its effect (cleanups, setup) and check the
        # result where it matters.
        - github.com/griffithind/dcx/test/helpers.RunDCXInDir
        - github.com/griffithind/dcx/test/helpers.RunDCX
    depguard:
      rules:
        # Only internal/cli and internal/ui print; everything else reports
        # through report.Reporter.
        no-printing-in-libraries:
          files:
            - "$all"
            - "!**/internal/cli/**"
            - "!**/internal/ui/**"
            - "!**/cmd/**"
          deny:
            - pkg: github.com/griffithind/dcx/internal/ui
              desc: library code takes a report.Reporter; only internal/cli prints

        # The agent is compiled into a small static binary that runs in every
        # container; it must not pull in host-side dcx.
        agent-stays-small:
          files:
            - "**/internal/agent/**"
            - "**/cmd/dcx-agent/**"
          deny:
            - pkg: github.com/spf13/cobra
              desc: the agent uses the standard flag package
            - pkg: github.com/griffithind/dcx/internal/container
              desc: host-side code; share constants through internal/agentproto
            - pkg: github.com/griffithind/dcx/internal/service
              desc: host-side code; share constants through internal/agentproto
            - pkg: github.com/griffithind/dcx/internal/devcontainer
              desc: host-side code; share constants through internal/agentproto

        # Only the container engine runs docker. Library packages go through
        # container.Engine (or build.Engine), so they can be tested against
        # containertest.Fake. Packages that legitimately run other host
        # programs are excluded: lifecycle (initializeCommand), secrets
        # (secret commands), registryauth (docker credential helpers),
        # selfupdate (runs the downloaded dcx once), the cli (OpenSSH
        # hand-off) and the agent.
        engine-runs-docker:
          files:
            - "$all"
            - "!**/internal/container/docker.go"
            - "!**/internal/cli/**"
            - "!**/internal/lifecycle/**"
            - "!**/internal/secrets/**"
            - "!**/internal/registryauth/**"
            - "!**/internal/selfupdate/**"
            - "!**/internal/agent/**"
            - "!**/cmd/**"
            - "!$test"
            - "!**/test/**"
          deny:
            - pkg: os/exec
              desc: run docker through container.Engine (add a method there if one is missing)

        # The host/agent contract is compiled into both binaries.
        agentproto-stdlib-only:
          list-mode: strict
          files:
            - "**/internal/agentproto/**"
          allow:
            - $gostd
